questions:

  - id: ats005-final-q01
    type: single_choice
    difficulty: intermediate
    learning_objective: "Move an account with its files to a new primary group and home"
    source_readings:
      - sections/section-010/module-01/course-01-primary-groups-and-moving-a-home.md
    prompt: |-
      You run `sudo usermod -g finance -d /home/accounts/bob -m bob` to move `bob` into the `finance` group and relocate his home directory. The command completes with no errors. What is the state of `bob`'s old home directory's files immediately afterward?
    options:
      - id: a
        text: "They are copied to the new path, and the old path still exists with the originals untouched."
        explanation: "This option is incorrect because `-m` moves (not copies) the directory — the old path does not survive."
      - id: b
        text: "They are moved to the new path, and the old directory is gone; but files `bob` already owned elsewhere on disk still show his old group, since `usermod -g` only rewrites the GID field in `/etc/passwd`."
        explanation: "Correct. `-m` (`--move-home`) is what actually copies the old home directory's contents to the new path and removes the old directory once combined with `-d`. But `-g` only changes the primary GID field in `/etc/passwd` — it is never retroactive against existing file ownership elsewhere on disk. Any files `bob` already owned under his old group keep that group until explicitly `chown`/`chgrp`'d."
      - id: c
        text: "They remain in the old path; `usermod` only ever rewrites text fields in `/etc/passwd` and never touches the filesystem, even with `-m`."
        explanation: "This option is incorrect because `-m` specifically exists to move file contents; without it, only the passwd record would change."
      - id: d
        text: "They are deleted entirely, since `-m` without `-d` is required to preserve file contents."
        explanation: "This option is incorrect because `-m` combined with `-d` is exactly the safe, documented way to relocate a home directory without losing data."
    correct_option: b
    explanation: "`-m` (`--move-home`) is what actually copies the old home directory's contents to the new path and removes the old directory once combined with `-d`. But `-g` only changes the primary GID field in `/etc/passwd` — it is never retroactive against existing file ownership elsewhere on disk. Any files `bob` already owned under his old group keep that group until explicitly `chown`/`chgrp`'d."

  - id: ats005-final-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Grant one exact command through sudo with no password"
    source_readings:
      - sections/section-010/module-01/course-03-a-scoped-sudo-rule.md
    prompt: |-
      You need `user2` to run `sudo bash /root/dangerous.sh` with no password prompt, and nothing else. Which `/etc/sudoers.d/` entry correctly satisfies this with least privilege?
    options:
      - id: a
        text: "`user2 ALL=(ALL) NOPASSWD: ALL`"
        explanation: "This option is incorrect because it grants unlimited root access to any command — a severe over-grant far beyond the task."
      - id: b
        text: "`user2 ALL=(root) NOPASSWD: /root/dangerous.sh`"
        explanation: "This option is incorrect because it only matches `sudo /root/dangerous.sh` run directly, not `sudo bash /root/dangerous.sh` — the invoked command differs from what's authorized."
      - id: c
        text: "`user2 ALL=(root) NOPASSWD: /usr/bin/bash /root/dangerous.sh`"
        explanation: "Correct. `sudoers` command matching is literal, including the invoked form. The user runs `sudo bash /root/dangerous.sh`, meaning the executed binary is `bash` (resolved to its absolute path) with the script as an argument — not the script executed directly via its own shebang. The rule must authorize exactly that invocation, and `NOPASSWD` is required since no password should be prompted."
      - id: d
        text: "`user2 ALL=(root) PASSWD: /usr/bin/bash /root/dangerous.sh`"
        explanation: "This option is incorrect because `PASSWD` (or omitting a tag, which defaults to requiring one) would still prompt for a password, failing the \"no password\" requirement."
    correct_option: c
    explanation: "`sudoers` command matching is literal, including the invoked form. The user runs `sudo bash /root/dangerous.sh`, meaning the executed binary is `bash` (resolved to its absolute path) with the script as an argument — not the script executed directly via its own shebang. The rule must authorize exactly that invocation, and `NOPASSWD` is required since no password should be prompted."

  - id: ats005-final-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict where a new GID comes from"
    source_readings:
      - sections/section-010/module-02/course-01-creating-groups-and-adding-members.md
    prompt: |-
      You run `sudo groupadd datateam` with no other flags. Where does the resulting GID come from?
    options:
      - id: a
        text: "It is always `1000`, the standard first user GID on every distribution."
        explanation: "This option is incorrect because `1000` is a common first *user* UID/GID convention on some distros, not a fixed rule `groupadd` follows for every new group."
      - id: b
        text: "`groupadd` assigns the next available GID at or above the range configured in `/etc/login.defs` (for example `GID_MIN`/`GID_MAX`), skipping any already in use."
        explanation: "Correct. Without `-g`, `groupadd` consults `/etc/login.defs` for the configured GID range and picks the next free number in that range — the same mechanism `useradd` uses for UIDs. This is exactly why a task that requires an *exact* GID (like `5000`) must pass `-g 5000` explicitly rather than relying on the default."
      - id: c
        text: "It is randomly generated to avoid collisions across a fleet of machines."
        explanation: "This option is incorrect because GID assignment is deterministic (next available in range), not random."
      - id: d
        text: "`groupadd` refuses to run without an explicit `-g`, so the command above would fail."
        explanation: "This option is incorrect because `-g` is optional; `groupadd` works fine without it."
    correct_option: b
    explanation: "Without `-g`, `groupadd` consults `/etc/login.defs` for the configured GID range and picks the next free number in that range — the same mechanism `useradd` uses for UIDs. This is exactly why a task that requires an *exact* GID (like `5000`) must pass `-g 5000` explicitly rather than relying on the default."

  - id: ats005-final-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Rename a group while keeping its GID and files"
    source_readings:
      - sections/section-010/module-02/course-03-renaming-and-deleting-groups.md
    prompt: |-
      You rename group `legacy-ops` (GID `4200`) to `platform-ops` with `sudo groupmod -n platform-ops legacy-ops`. A file on disk was previously `chown`'d to `legacy-ops` by name. After the rename, what does `ls -l` show as that file's group?
    options:
      - id: a
        text: "`platform-ops` — the new name, because `groupmod -n` only changes the name, not the GID, and `ls -l` resolves the file's stored GID against `/etc/group` at display time."
        explanation: "Correct. Files on disk store ownership as a numeric GID, never a name. `ls -l` looks up that number against `/etc/group` every time it displays output. `groupmod -n` changes only the name field for GID `4200`, leaving the GID itself untouched — so any file already tagged with GID `4200` instantly displays under the new name with zero `chown`/`chgrp` needed."
      - id: b
        text: "`legacy-ops` — file ownership is permanently locked to the name at the time of `chown` and does not follow renames."
        explanation: "This option is incorrect because file ownership is GID-based, not name-based, so it does follow a rename automatically."
      - id: c
        text: "A numeric GID like `4200`, because renaming a group always orphans every file that referenced the old name."
        explanation: "A rename alone does not change the GID, so nothing becomes orphaned by this operation (orphaning only happens if the GID itself is deleted or changed, as `groupdel`'s man page warns)."
      - id: d
        text: "`nobody`, because the rename invalidates the old name and the kernel falls back to the unknown-owner placeholder."
        explanation: "This option is incorrect because `nobody` only appears when a GID has **no** corresponding entry in `/etc/group` at all, which isn't the case here."
    correct_option: a
    explanation: "Files on disk store ownership as a numeric GID, never a name. `ls -l` looks up that number against `/etc/group` every time it displays output. `groupmod -n` changes only the name field for GID `4200`, leaving the GID itself untouched — so any file already tagged with GID `4200` instantly displays under the new name with zero `chown`/`chgrp` needed."

  - id: ats005-final-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain when a new group membership takes effect"
    source_readings:
      - sections/section-010/module-02/course-02-when-membership-takes-effect.md
    prompt: |-
      You just added `marta` to the `datateam` group with `sudo usermod -aG datateam marta`. Marta already had an open terminal session before you ran this. She immediately runs `id` in that same session. What do you expect?
    options:
      - id: a
        text: "`datateam` will not appear in her `groups=` list, because group membership is only evaluated fresh at login/session start, not retroactively into an already-running shell."
        explanation: "Correct. A user's supplementary group list is computed once at login (or session start) and cached in that session's process credentials. `/etc/group` being updated afterward doesn't retroactively push into already-running shells. Marta needs a new session (fresh login, new SSH connection, or `newgrp`) — or `su - marta` — to see `datateam` reflected."
      - id: b
        text: "`datateam` appears immediately, because `/etc/group` is polled continuously by every running shell."
        explanation: "There is no continuous polling of `/etc/group` by running shells."
      - id: c
        text: "`id` always shows live membership regardless of session age, unlike `groups`, which is the one that lags."
        explanation: "Both `id` and `groups` read the same cached session credentials; neither is \"live\" mid-session."
      - id: d
        text: "Marta's session will be forcibly terminated the moment her group memberships change."
        explanation: "Changing group membership has no effect on already-running sessions at all, let alone terminating them."
    correct_option: a
    explanation: "A user's supplementary group list is computed once at login (or session start) and cached in that session's process credentials. `/etc/group` being updated afterward doesn't retroactively push into already-running shells. Marta needs a new session (fresh login, new SSH connection, or `newgrp`) — or `su - marta` — to see `datateam` reflected."

  - id: ats005-final-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the real useradd defaults before relying on them"
    source_readings:
      - sections/section-010/module-03/course-01-defaults-and-a-forced-password-change.md
    prompt: |-
      You create `contractor7` with `sudo useradd -m contractor7` (no `-s`/`-b` overrides) and want to confirm the shell and home base path it actually received before assuming anything. Which command reveals the *system's configured defaults* directly, without guessing?
    options:
      - id: a
        text: "`cat /etc/passwd | grep contractor7`"
        explanation: "This option is incorrect because it shows what was *actually assigned* to one already-created account, not the *configured defaults* the question asks to confirm independently."
      - id: b
        text: "`useradd -D`"
        explanation: "Correct. `useradd -D` prints the exact defaults `useradd` pulls from `/etc/default/useradd` (and consults alongside `/etc/login.defs`) — default shell, home base directory, default group behavior, and account inactivity/expire defaults — before you ever create an account, or to audit what a plain `useradd` call actually used."
      - id: c
        text: "`sudo chage -l contractor7`"
        explanation: "`chage -l` reports password/account aging fields, not shell or home base path defaults."
      - id: d
        text: "`id contractor7`"
        explanation: "`id` reports UID/GID/groups, not shell or home directory defaults."
    correct_option: b
    explanation: "`useradd -D` prints the exact defaults `useradd` pulls from `/etc/default/useradd` (and consults alongside `/etc/login.defs`) — default shell, home base directory, default group behavior, and account inactivity/expire defaults — before you ever create an account, or to audit what a plain `useradd` call actually used."

  - id: ats005-final-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Make an account expire on a date with chage"
    source_readings:
      - sections/section-010/module-03/course-02-password-aging-and-account-expiration.md
    prompt: |-
      You need `contractor7`'s account (not just their password) to stop working entirely, automatically, in exactly 30 days. Which `chage` flag accomplishes this?
    options:
      - id: a
        text: "`chage -M 30 contractor7` — sets the maximum password age to 30 days."
        explanation: "`-M` controls password expiry cadence, not whether the whole account stops working."
      - id: b
        text: "`chage -E $(date -d \"+30 days\" +%Y-%m-%d) contractor7` — sets the account expiration date."
        explanation: "Correct. `-E` (`--expiredate`) sets the account's own expiration date — after which the account itself is completely unusable, independent of password state. This is distinct from password *expiry* (`-M`), which only forces a password change but leaves the account active."
      - id: c
        text: "`chage -d 0 contractor7` — forces a password reset at next login."
        explanation: "`-d 0` forces an immediate password change at next login, unrelated to a 30-day account-level expiration."
      - id: d
        text: "`chage -I 30 contractor7` — sets a 30-day inactivity lock after password expiry."
        explanation: "`-I` sets a grace/inactivity period counted *after* the password already expired, not a direct 30-day account expiration."
    correct_option: b
    explanation: "`-E` (`--expiredate`) sets the account's own expiration date — after which the account itself is completely unusable, independent of password state. This is distinct from password *expiry* (`-M`), which only forces a password change but leaves the account active."

  - id: ats005-final-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Grant a user access with a named ACL entry"
    source_readings:
      - sections/section-020/module-01/course-01-reading-and-granting-acl-entries.md
    prompt: |-
      A shared directory `/srv/projects/orion` is owned `team-lead:orion-team`, mode `750`. Contractor `contractor-jane` (not a member of `orion-team`) needs read-write access to the entire tree, and should never be added to the group. Which approach satisfies this correctly?
    options:
      - id: a
        text: "`sudo usermod -aG orion-team contractor-jane`"
        explanation: "This option is incorrect because it explicitly violates the \"never add her to the group\" constraint."
      - id: b
        text: "`sudo chmod -R 770 /srv/projects/orion`"
        explanation: "This option is incorrect because widening the group-bit to `770` grants write to *every* `orion-team` member, not just Jane, and still doesn't cover her since she isn't in the group."
      - id: c
        text: "`sudo setfacl -R -m u:contractor-jane:rwx /srv/projects/orion`"
        explanation: "Correct. POSIX ACLs let you grant a specific extra user rights on a file or directory tree without altering group membership, ownership, or the standard permission bits. `setfacl -R -m u:contractor-jane:rwx` grants exactly that, recursively, while `orion-team`'s membership and `team-lead`'s ownership stay untouched."
      - id: d
        text: "`sudo chown -R contractor-jane /srv/projects/orion`"
        explanation: "This option is incorrect because changing ownership displaces `team-lead` as the file owner entirely, which is destructive and unnecessary."
    correct_option: c
    explanation: "POSIX ACLs let you grant a specific extra user rights on a file or directory tree without altering group membership, ownership, or the standard permission bits. `setfacl -R -m u:contractor-jane:rwx` grants exactly that, recursively, while `orion-team`'s membership and `team-lead`'s ownership stay untouched."

  - id: ats005-final-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Add a default ACL for files created later"
    source_readings:
      - sections/section-020/module-01/course-02-default-acls.md
    prompt: |-
      You've run `setfacl -m u:auditor-tom:r-x /srv/projects/orion` on an existing directory tree, but new files created inside it afterward do not carry Tom's read access automatically. What's missing?
    options:
      - id: a
        text: "A recursive `chmod -R` needs to be run after every new file is created."
        explanation: "That would be a manual, error-prone workaround; default ACLs exist specifically to avoid it."
      - id: b
        text: "A **default ACL** entry (`setfacl -d -m u:auditor-tom:r-x /srv/projects/orion`) needs to be set on the directory so newly created files/subdirectories inherit the same entry automatically."
        explanation: "Correct. A plain `setfacl -m` entry only applies to the objects that exist at the time it's run. A **default** ACL (the `-d` flag) is a separate, inheritable rule attached to the directory itself — every new file or subdirectory created afterward automatically picks up a matching regular ACL entry at creation time, with no manual re-application needed."
      - id: c
        text: "ACLs never apply to files created after the `setfacl` command runs; they must be re-applied by hand every time, permanently."
        explanation: "ACLs absolutely can apply automatically to future files, that's exactly what default ACLs are for."
      - id: d
        text: "The `orion-team` group's GID needs to be added to the mask entry."
        explanation: "The mask entry caps effective permissions for named entries, it does not control inheritance to new files."
    correct_option: b
    explanation: "A plain `setfacl -m` entry only applies to the objects that exist at the time it's run. A **default** ACL (the `-d` flag) is a separate, inheritable rule attached to the directory itself — every new file or subdirectory created afterward automatically picks up a matching regular ACL entry at creation time, with no manual re-application needed."

  - id: ats005-final-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why a .bashrc limit does not bind other sessions"
    source_readings:
      - sections/section-020/module-02/course-01-why-a-bashrc-limit-is-not-enough.md
    prompt: |-
      A user's process-count limit was set with `ulimit -H -u 200` inside their personal `~/.bashrc`. A coworker reports the limit "doesn't apply" when the same user's jobs are launched via `cron`. Why?
    options:
      - id: a
        text: "`cron` jobs always run as root, bypassing all user-level limits."
        explanation: "Cron jobs run as the crontab owner by default, not automatically as root."
      - id: b
        text: "`.bashrc` is only sourced by interactive, non-login shells — `cron`-launched processes never source it, so the limit was never actually enforced outside that one shell type."
        explanation: "Correct. A `ulimit` command inside `.bashrc` only takes effect for shells that actually source that file — interactive, non-login shells. `cron` jobs, `systemd`-launched services, and `su` without a login shell never source `.bashrc`, so the limit silently doesn't apply there. The system-wide, PAM-enforced mechanism (`/etc/security/limits.conf` + `pam_limits.so`) is required for a limit to apply regardless of how the session started."
      - id: c
        text: "`ulimit -H` only applies to soft limits, and cron respects only hard limits."
        explanation: "`-H` explicitly sets the hard limit; the issue is the file never gets sourced, not a soft/hard mismatch."
      - id: d
        text: "`cron` ignores all `nproc` limits by design, regardless of where they're configured."
        explanation: "Cron does respect `nproc` limits when they're actually applied through a mechanism it participates in, like PAM."
    correct_option: b
    explanation: "A `ulimit` command inside `.bashrc` only takes effect for shells that actually source that file — interactive, non-login shells. `cron` jobs, `systemd`-launched services, and `su` without a login shell never source `.bashrc`, so the limit silently doesn't apply there. The system-wide, PAM-enforced mechanism (`/etc/security/limits.conf` + `pam_limits.so`) is required for a limit to apply regardless of how the session started."

  - id: ats005-final-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Limit a group to one login session"
    source_readings:
      - sections/section-020/module-02/course-03-one-login-per-group-member.md
    prompt: |-
      You need every member of the `operators` group capped at exactly one concurrent login system-wide, enforced no matter how they connect. Which line belongs in `/etc/security/limits.conf`?
    options:
      - id: a
        text: "`operators hard maxlogins 1`"
        explanation: "Without the `@` prefix, `operators` is parsed as a literal *username*, not a group."
      - id: b
        text: "`@operators - maxlogins 1`"
        explanation: "`-` sets both soft and hard identically, which can work, but doesn't match the documented, exam-expected hard-limit convention for this exact competency as clearly as `hard` does."
      - id: c
        text: "`@operators hard maxlogins 1`"
        explanation: "Correct. The `@groupname` syntax targets every member of a group as the domain. `maxlogins` is inherently a hard-style cap on concurrent sessions (not something meaningfully split into soft/hard nuance for this specific item in the way process/file limits are), and `hard` is the conventional, unambiguous choice to guarantee it's enforced as a strict ceiling for the whole group."
      - id: d
        text: "`* soft maxlogins 1`"
        explanation: "`*` applies to every user on the system, not specifically the `operators` group."
    correct_option: c
    explanation: "The `@groupname` syntax targets every member of a group as the domain. `maxlogins` is inherently a hard-style cap on concurrent sessions (not something meaningfully split into soft/hard nuance for this specific item in the way process/file limits are), and `hard` is the conventional, unambiguous choice to guarantee it's enforced as a strict ceiling for the whole group."

  - id: ats005-final-q12
    type: single_choice
    difficulty: intermediate
    learning_objective: "Set a variable for every user's shells"
    source_readings:
      - sections/section-030/module-01/course-01-the-ship-wide-notice-board.md
    prompt: |-
      The infrastructure team needs `COMPANY_PROXY=http://proxy.internal:3128` available to **every** user, for both login *and* non-login interactive shells, without editing any individual user's dotfiles. Which file is the correct system-wide mechanism for this specific requirement?
    options:
      - id: a
        text: "`/etc/profile.d/company-proxy.sh`, since `.sh` scripts under `profile.d` are sourced for every shell type."
        explanation: "`/etc/profile.d/*.sh` scripts are only sourced by `/etc/profile`, which fires for **login** shells; a non-login interactive shell that only sources `~/.bashrc` never reaches them."
      - id: b
        text: "`/etc/environment`, since PAM parses and exports it into every user's session environment regardless of shell type or login/non-login distinction."
        explanation: "Correct. `/etc/environment` is parsed by `pam_env` at session-open time (not sourced as a shell script), which is exactly why it reaches every session type uniformly — login and non-login, interactive and not — without depending on which shell dotfiles a particular session happens to source."
      - id: c
        text: "`~/.bashrc` for each existing user, copied manually."
        explanation: "This is exactly the fragile per-user editing the \"without editing any individual user's dotfiles\" requirement rules out, and it wouldn't cover future accounts either."
      - id: d
        text: "`/etc/skel/.bashrc`, so it only affects accounts created afterward."
        explanation: "`/etc/skel` only seeds new accounts' home directories at creation time; it has zero effect on existing accounts."
    correct_option: b
    explanation: "`/etc/environment` is parsed by `pam_env` at session-open time (not sourced as a shell script), which is exactly why it reaches every session type uniformly — login and non-login, interactive and not — without depending on which shell dotfiles a particular session happens to source."

  - id: ats005-final-q13
    type: single_choice
    difficulty: intermediate
    learning_objective: "Append a directory to PATH without shadowing system commands"
    source_readings:
      - sections/section-030/module-02/course-02-appending-and-saving-path.md
    prompt: |-
      User `candidate` wants `~/work` on their `PATH` so their personal scripts run by name, but a script in `~/work` must **never** override an existing system command of the same name. Which change satisfies this?
    options:
      - id: a
        text: "`export PATH=\"$HOME/work:$PATH\"` in `~/.bash_profile`"
        explanation: "**prepending** `~/work` means anything placed there is found *before* system directories, meaning a maliciously or accidentally named script (`ls`, `sudo`, etc.) would run instead of the real command — a privilege-escalation risk, and the opposite of \"never shadow.\""
      - id: b
        text: "`export PATH=\"$PATH:$HOME/work\"` in `~/.bash_profile`"
        explanation: "Correct. `PATH` is searched left to right, first match wins. **Appending** `~/work` after the existing `$PATH` guarantees any system command of the same name (found earlier in the existing path entries) is resolved first — a same-named script in `~/work` can never shadow it. Placing it in `~/.bash_profile` (a login-shell dotfile) also makes the change persistent across new sessions."
      - id: c
        text: "`export PATH=\"$HOME/work:$PATH\"` in `~/.bashrc` only"
        explanation: "For the same prepend reasoning, and additionally `.bashrc` alone doesn't reliably cover every session type a login shell would."
      - id: d
        text: "`alias work='cd ~/work'` in `~/.bash_profile`"
        explanation: "An alias to `cd` does nothing to make scripts inside `~/work` runnable by name from anywhere."
    correct_option: b
    explanation: "`PATH` is searched left to right, first match wins. **Appending** `~/work` after the existing `$PATH` guarantees any system command of the same name (found earlier in the existing path entries) is resolved first — a same-named script in `~/work` can never shadow it. Placing it in `~/.bash_profile` (a login-shell dotfile) also makes the change persistent across new sessions."

  - id: ats005-final-q14
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why a changed PATH needs a fresh session"
    source_readings:
      - sections/section-030/module-02/course-02-appending-and-saving-path.md
    prompt: |-
      Right after editing `~/.bash_profile` to change `PATH`, you run `echo $PATH` in your *current* terminal and see no change at all. Why, and what's the correct next step?
    options:
      - id: a
        text: "The edit failed silently; re-open the file and check for a typo."
        explanation: "This is expected, normal shell behavior, not a sign of failure."
      - id: b
        text: "Dotfile edits only take effect for *new* shells that source that file — your current shell already has its environment loaded and won't re-read the file until a new login shell starts (or you explicitly re-source it)."
        explanation: "Correct. Shell dotfiles are only read when a matching new shell session starts. An already-running shell already evaluated `~/.bash_profile` once at its own startup and holds that environment in memory — it has no reason to re-read the file afterward. Opening a fresh login shell (or `source ~/.bash_profile` in the current one) is what surfaces the change."
      - id: c
        text: "`PATH` changes require a full system reboot to take effect."
        explanation: "A reboot is unnecessary; a new shell session is sufficient."
      - id: d
        text: "`bash` caches `PATH` permanently at install time; only `type` and `which` reflect live changes."
        explanation: "`bash` does not permanently cache `PATH` at install time; it reads dotfiles fresh at each new shell's startup."
    correct_option: b
    explanation: "Shell dotfiles are only read when a matching new shell session starts. An already-running shell already evaluated `~/.bash_profile` once at its own startup and holds that environment in memory — it has no reason to re-read the file afterward. Opening a fresh login shell (or `source ~/.bash_profile` in the current one) is what surfaces the change."

  - id: ats005-final-q15
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain the cn=config model of OpenLDAP"
    source_readings:
      - sections/section-040/module-01/course-01-the-configuration-is-a-tree.md
    prompt: |-
      You are provisioning a brand-new OpenLDAP server. Which statement about its configuration model is accurate on a modern installation?
    options:
      - id: a
        text: "All configuration lives in a single flat `/etc/ldap/slapd.conf` file, edited directly with a text editor."
        explanation: "That describes the legacy model modern OpenLDAP moved away from."
      - id: b
        text: "Configuration lives in the `cn=config` dynamic backend — a live directory tree of its own, modified via LDIF operations (for example `ldapmodify`) against the running server, not a flat text file."
        explanation: "Correct. Modern OpenLDAP replaced the legacy flat `slapd.conf` with the `cn=config` dynamic configuration backend — configuration is itself directory data, changed live via LDIF `ldapmodify` operations (commonly authenticated with `-Y EXTERNAL` over the `ldapi:///` local socket), without needing to restart `slapd` for most changes."
      - id: c
        text: "OpenLDAP has no persistent configuration; every setting must be passed as a `slapd` command-line flag at every startup."
        explanation: "`cn=config` is exactly the persistent configuration store; nothing needs to be repeated as command-line flags at every start."
      - id: d
        text: "TLS certificate paths can only be set by recompiling `slapd` from source with the paths hardcoded."
        explanation: "TLS paths are set via `olcTLSCertificateFile`/`olcTLSCertificateKeyFile`/`olcTLSCACertificateFile` attributes modified through `cn=config`, no recompilation involved."
    correct_option: b
    explanation: "Modern OpenLDAP replaced the legacy flat `slapd.conf` with the `cn=config` dynamic configuration backend — configuration is itself directory data, changed live via LDIF `ldapmodify` operations (commonly authenticated with `-Y EXTERNAL` over the `ldapi:///` local socket), without needing to restart `slapd` for most changes."

  - id: ats005-final-q16
    type: single_choice
    difficulty: intermediate
    learning_objective: "Prove a real TLS handshake"
    source_readings:
      - sections/section-040/module-01/course-04-opening-port-636-and-proving-tls.md
    prompt: |-
      After wiring TLS into your OpenLDAP server, which command sequence most directly proves that an actual encrypted handshake succeeds, as opposed to merely confirming the configuration was saved?
    options:
      - id: a
        text: "`cat /etc/ldap/slapd.d/cn=config/olcDatabase*/olcTLSCertificateFile.ldif`"
        explanation: "This only shows that a certificate path was *saved* in configuration, not that TLS actually negotiates successfully at runtime."
      - id: b
        text: "`sudo systemctl status slapd`"
        explanation: "A running daemon doesn't confirm TLS is correctly wired; `slapd` can be \"active\" while TLS is completely broken."
      - id: c
        text: "`ldapsearch -x -ZZ -H ldap://127.0.0.1 -b \"\" -s base` (or `openssl s_client -connect 127.0.0.1:636`)"
        explanation: "Correct. `-ZZ` forces `ldapsearch` to require StartTLS and abort if the negotiation fails, actually exercising the encrypted handshake rather than just reaching the server. `openssl s_client` against port 636 similarly performs and reports a live TLS negotiation. Both prove the handshake actually works, not just that a config value exists."
      - id: d
        text: "`ss -tlnp | grep 636`"
        explanation: "A listening socket on 636 confirms the port is open, not that a TLS handshake against it actually completes."
    correct_option: c
    explanation: "`-ZZ` forces `ldapsearch` to require StartTLS and abort if the negotiation fails, actually exercising the encrypted handshake rather than just reaching the server. `openssl s_client` against port 636 similarly performs and reports a live TLS negotiation. Both prove the handshake actually works, not just that a config value exists."

  - id: ats005-final-q17
    type: single_choice
    difficulty: intermediate
    learning_objective: "Name the attributes a POSIX account needs"
    source_readings:
      - sections/section-040/module-02/course-02-the-group-and-the-user.md
    prompt: |-
      You add a new POSIX user via LDIF with `objectClass: posixAccount`. Which set of attributes is *required* for this object class (the exact fields NSS/`sssd` will later read on a client)?
    options:
      - id: a
        text: "`mail`, `telephoneNumber`, `displayName`"
        explanation: "Those are `inetOrgPerson`-style contact attributes, not what makes an entry a usable POSIX account."
      - id: b
        text: "`uidNumber`, `gidNumber`, `homeDirectory`, `loginShell`"
        explanation: "Correct. `posixAccount` requires `uidNumber` (numeric UID), `gidNumber` (primary GID), `homeDirectory`, and (in practice) `loginShell` to behave as a usable Unix account — these are exactly the same fields NSS/`sssd` consult client-side to resolve the account as if it were a local `/etc/passwd` entry."
      - id: c
        text: "`member`, `ou`, `description`"
        explanation: "`member` belongs to group object classes like `groupOfNames`, not `posixAccount`."
      - id: d
        text: "`cn`, `sn` only"
        explanation: "`cn`/`sn` are naming attributes from `person`-family object classes, not the POSIX-specific UID/GID/home/shell fields this question asks about."
    correct_option: b
    explanation: "`posixAccount` requires `uidNumber` (numeric UID), `gidNumber` (primary GID), `homeDirectory`, and (in practice) `loginShell` to behave as a usable Unix account — these are exactly the same fields NSS/`sssd` consult client-side to resolve the account as if it were a local `/etc/passwd` entry."

  - id: ats005-final-q18
    type: single_choice
    difficulty: intermediate
    learning_objective: "Prove an authenticated bind as a directory user"
    source_readings:
      - sections/section-040/module-02/course-03-setting-the-password-and-proving-the-bind.md
    prompt: |-
      After setting `lfcsuser`'s password, which single command most cleanly proves an authenticated bind as that user succeeds, without the added complexity of interpreting search results?
    options:
      - id: a
        text: "`ldapsearch -x -b \"dc=example,dc=com\" \"(uid=lfcsuser)\"`"
        explanation: "An anonymous or admin-bound search can locate the entry without ever proving `lfcsuser`'s own password is correct."
      - id: b
        text: "`ldapwhoami -x -D \"uid=lfcsuser,ou=people,dc=example,dc=com\" -w '<password>' -H ldap://127.0.0.1 -Z`"
        explanation: "Correct. `ldapwhoami` performs the \"Who am I?\" extended LDAP operation — it authenticates with the given bind DN and password and simply confirms identity, with no search results to parse. It's the cleanest possible proof that a specific bind DN/password combination is valid over the given connection (here, requiring StartTLS via `-Z`)."
      - id: c
        text: "`slappasswd -s '<password>'`"
        explanation: "`slappasswd` only generates a password hash locally; it never contacts the directory or proves a bind works."
      - id: d
        text: "`getent passwd lfcsuser`"
        explanation: "`getent` queries local NSS sources (only meaningful client-side after `sssd`/NSS is wired up), and proves resolution, not an authenticated LDAP bind."
    correct_option: b
    explanation: "`ldapwhoami` performs the \"Who am I?\" extended LDAP operation — it authenticates with the given bind DN and password and simply confirms identity, with no search results to parse. It's the cleanest possible proof that a specific bind DN/password combination is valid over the given connection (here, requiring StartTLS via `-Z`)."

  - id: ats005-final-q19
    type: single_choice
    difficulty: intermediate
    learning_objective: "Find why directory users do not resolve on a client"
    source_readings:
      - sections/section-040/module-03/course-03-wiring-nss-and-checking-in-order.md
    prompt: |-
      On the LDAP client, you've written `/etc/sssd/sssd.conf` and restarted `sssd`, but `getent passwd lfcsuser` still returns nothing. `sssd.conf` itself looks syntactically correct. What is the most likely single cause?
    options:
      - id: a
        text: "`sssd.conf` is not `600`, owned `root:root` — `sssd` refuses to start (or silently ignores the file) if permissions are too open."
        explanation: "This option alone is incomplete — it's a valid cause, but not the only one worth checking."
      - id: b
        text: "`nsswitch.conf`'s `passwd`/`group` lines still only list `files`, without `sss` added, so NSS never consults `sssd` at all regardless of how correct `sssd.conf` is."
        explanation: "This option alone is incomplete for the same reason in reverse."
      - id: c
        text: "Both A and B are plausible single causes and should both be checked."
        explanation: "Correct. Either misconfiguration independently breaks resolution: `sssd` demands `sssd.conf` be `600 root:root` or it won't trust (and may refuse to start with) the file at all, and separately, `nsswitch.conf` must list `sss` on the `passwd`/`group` lines or NSS never even asks `sssd` for the answer — a perfectly correct `sssd.conf` is irrelevant if NSS isn't configured to consult it. Both should be checked, in that order (permissions first, since a refused-to-start daemon makes the nsswitch question moot)."
      - id: d
        text: "`getent` never works with LDAP-backed accounts under any configuration; only `id` does."
        explanation: "`getent passwd` fully supports NSS-backed sources including `sss`, and is in fact the recommended first verification step, *before* testing an interactive login."
    correct_option: c
    explanation: "Either misconfiguration independently breaks resolution: `sssd` demands `sssd.conf` be `600 root:root` or it won't trust (and may refuse to start with) the file at all, and separately, `nsswitch.conf` must list `sss` on the `passwd`/`group` lines or NSS never even asks `sssd` for the answer — a perfectly correct `sssd.conf` is irrelevant if NSS isn't configured to consult it. Both should be checked, in that order (permissions first, since a refused-to-start daemon makes the nsswitch question moot)."

  - id: ats005-final-q20
    type: single_choice
    difficulty: intermediate
    learning_objective: "Confirm local accounts are unaffected after wiring sssd"
    source_readings:
      - sections/section-040/module-03/course-03-wiring-nss-and-checking-in-order.md
    prompt: |-
      After successfully wiring `sssd` for LDAP authentication on a client, you want to confirm local accounts are completely unaffected. Which check most directly proves this?
    options:
      - id: a
        text: "`getent passwd root` still resolves root as UID `0` from the local `files` source, unaffected by whatever state LDAP/`sssd` is in."
        explanation: "Correct. `nsswitch.conf`'s ordering (`files sss`) means local accounts are always resolved from `/etc/passwd` first, regardless of `sssd`'s health. Directly confirming `root` (or any known-local account) still resolves correctly via `getent` is the most direct proof that adding LDAP as a source didn't disturb local account resolution at all."
      - id: b
        text: "`systemctl status sssd` shows \"active (running)\"."
        explanation: "A running `sssd` daemon says nothing about whether local accounts specifically are unaffected."
      - id: c
        text: "`ldapsearch -x -b \"dc=example,dc=com\" \"(uid=root)\"` returns no results."
        explanation: "Confirming `root` isn't *in LDAP* doesn't prove local resolution of `root` still works; it only shows the directory itself has no such entry, which was never the concern."
      - id: d
        text: "`id lfcsuser` resolves correctly."
        explanation: "That proves the LDAP side works, not that local accounts remain unaffected, which is what this question specifically asks to verify."
    correct_option: a
    explanation: "`nsswitch.conf`'s ordering (`files sss`) means local accounts are always resolved from `/etc/passwd` first, regardless of `sssd`'s health. Directly confirming `root` (or any known-local account) still resolves correctly via `getent` is the most direct proof that adding LDAP as a source didn't disturb local account resolution at all."

  - id: ats005-final-q21
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read the last matching sudoers rule"
    source_readings:
      - sections/section-010/module-04/course-02-aliases-and-group-rules.md
    prompt: |-
      A policy file has these lines, in this order. `ben` is in `webops`.

      ```text
      %webops ALL=(root) NOPASSWD: /usr/bin/systemctl status ssh
      ben ALL=(root) /usr/bin/systemctl status ssh
      ```

      What happens when `ben` runs `sudo systemctl status ssh`?
    options:
      - id: a
        text: "He is asked for a password, because the last matching rule wins and has no `NOPASSWD:`."
        explanation: "Correct. The user rule comes last, so it decides."
      - id: b
        text: "No prompt, because the group rule is more specific."
        explanation: "No. Order decides, not the kind of name."
      - id: c
        text: "The command is denied, because two rules conflict."
        explanation: "No. Rules do not conflict. The last match is used."
      - id: d
        text: "No prompt, because the first matching rule wins."
        explanation: "No. The last matching rule wins."
    correct_option: a
    explanation: "The user rule comes last, so it decides."

  - id: ats005-final-q22
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the right place for a service limit"
    source_readings:
      - sections/section-020/module-03/course-01-limits-for-a-service.md
    prompt: |-
      A database service started by `systemd` needs `65536` open files. Which change reaches it?
    options:
      - id: a
        text: "`LimitNOFILE=65536` in a drop-in for the service, then `daemon-reload` and a restart."
        explanation: "Correct. `systemd` sets the limit when it starts the process."
      - id: b
        text: "A `nofile` line in `/etc/security/limits.conf`."
        explanation: "No. Services do not go through `pam_limits`."
      - id: c
        text: "`ulimit -n 65536` in the administrator's shell."
        explanation: "No. It changes that shell only."
      - id: d
        text: "A `nofile` line in the user's `~/.bashrc`."
        explanation: "No. A service never reads it."
    correct_option: a
    explanation: "`systemd` sets the limit when it starts the process."

  - id: ats005-final-q23
    type: single_choice
    difficulty: intermediate
    learning_objective: "Give access to a mixed tree without making data files executable"
    source_readings:
      - sections/section-020/module-04/course-01-acls-on-a-whole-tree.md
    prompt: |-
      You grant read access to a whole tree of folders and data files. Which command avoids setting execute on plain data files?
    options:
      - id: a
        text: "`setfacl -R -m u:auditor-ivy:rX /srv/data/ledger`"
        explanation: "Correct. The capital `X` sets execute on folders and on files that are already executable."
      - id: b
        text: "`setfacl -R -m u:auditor-ivy:rx /srv/data/ledger`"
        explanation: "No. A lowercase `x` sets execute on every file."
      - id: c
        text: "`setfacl -R -m u:auditor-ivy:r /srv/data/ledger`"
        explanation: "No. Folders then lack `x`, so the user cannot enter them."
      - id: d
        text: "`setfacl -R -b /srv/data/ledger`"
        explanation: "No. This removes every entry."
    correct_option: a
    explanation: "The capital `X` sets execute on folders and on files that are already executable."

  - id: ats005-final-q24
    type: single_choice
    difficulty: intermediate
    learning_objective: "Recover ACLs after an accidental cleanup"
    source_readings:
      - sections/section-020/module-04/course-02-backup-and-restore.md
    prompt: |-
      A cleanup script removed every ACL from a tree. A file made earlier with `getfacl -R -p /srv/data/ledger > backup` exists. Which command brings the entries back?
    options:
      - id: a
        text: "`sudo setfacl --restore=backup`"
        explanation: "Correct. It reads the backup and sets entries, owners and groups."
      - id: b
        text: "`sudo getfacl --restore=backup`"
        explanation: "No. `getfacl` only prints. `setfacl` restores."
      - id: c
        text: "`sudo cp backup /srv/data/ledger`"
        explanation: "No. A copy of the text file changes no ACL."
      - id: d
        text: "`sudo chmod --reference=backup /srv/data/ledger`"
        explanation: "No. `chmod` sets the mode bits, not ACL entries."
    correct_option: a
    explanation: "It reads the backup and sets entries, owners and groups."

  - id: ats005-final-q25
    type: single_choice
    difficulty: intermediate
    learning_objective: "Enable home creation for directory users"
    source_readings:
      - sections/section-040/module-04/course-02-creating-homes-on-first-login.md
    prompt: |-
      Users from the directory log in over SSH and land in `/` with no home folder. Which single change fixes this for new logins?
    options:
      - id: a
        text: "Run `sudo pam-auth-update --enable mkhomedir`."
        explanation: "Correct. It adds a `session` step that builds the missing home."
      - id: b
        text: "Add `sss` to the `shadow` line of `nsswitch.conf`."
        explanation: "No. This is about lookups, not about creating folders."
      - id: c
        text: "Set `ldap_id_use_start_tls = true` in `sssd.conf`."
        explanation: "No. This seals the channel and does not create folders."
      - id: d
        text: "Restart `sssd`."
        explanation: "No. A restart does not create homes."
    correct_option: a
    explanation: "It adds a `session` step that builds the missing home."

  - id: ats005-final-q26
    type: single_choice
    difficulty: intermediate
    learning_objective: "Stock new homes from the starter kit"
    source_readings:
      - sections/section-040/module-04/course-02-creating-homes-on-first-login.md
    prompt: |-
      You want every directory user's new home to contain `WELCOME.txt`. Where do you put the file, and when must you do it?
    options:
      - id: a
        text: "In `/etc/skel`, before those users log in for the first time."
        explanation: "Correct. The starter kit is copied only when a home is created."
      - id: b
        text: "In `/home`, at any time. Every home picks it up."
        explanation: "No. `/home` is not copied into homes."
      - id: c
        text: "In `/etc/sssd`, so `sssd` can copy it."
        explanation: "No. `sssd` does not copy files into homes."
      - id: d
        text: "In each user's `~/.bashrc`."
        explanation: "No. This runs a script. It does not place a file."
    correct_option: a
    explanation: "The starter kit is copied only when a home is created."
