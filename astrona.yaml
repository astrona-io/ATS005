  - id: module-030
    title: "Section 030: Shell Environment, Profiles & PATH"
    description: >
      Master exactly which of the many dotfiles and drop-ins actually
      gets sourced for a given session type, set variables system-wide
      and personally through the correct mechanism for each, and extend
      a user's PATH persistently without opening a privilege-escalation
      hole.

