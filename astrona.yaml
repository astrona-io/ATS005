  - id: module-020
    title: "Section 020: Access Control & Resource Limits"
    description: >
      Extend permissions beyond the standard owner/group/other model with
      POSIX ACLs for one-off grants that don't touch group membership,
      and enforce resource limits the way the system actually respects
      them — through PAM and limits.conf, not a fragile per-user shell
      hack.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-020/README.md
      - type: reading
        title: "Access Control Lists: Permissions Beyond Three Buckets"
        path: sections/section-020/module-01/course.md
      - type: reading
        title: "Reading And Granting ACL Entries"
        path: sections/section-020/module-01/course-01-reading-and-granting-acl-entries.md
      - type: reading
        title: "Default ACLs For Files Created Later"
        path: sections/section-020/module-01/course-02-default-acls.md
      - type: reading
        title: "Question"
        path: labs/lab-021/docs/question.md
      - type: lab
        title: "ACL-Based Shared Directory Access Lab"
        path: labs/lab-021
        difficulty: intermediate
        estimated_duration: 20m
        topic: acl
        task_kind: build
        tags: [setfacl, getfacl, named-entries, default-acl, recursive, acl-mask]
        learning_goals:
          - Grant two users different access to a whole directory tree with named ACL entries
          - Add default ACL entries so new files inherit both grants
          - Keep the owner, group and base mode of the tree unchanged
        resources:
          - name: "setfacl manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man1/setfacl.1.html
          - name: "getfacl manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man1/getfacl.1.html
          - name: "acl manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man5/acl.5.html
      - type: reading
        title: "The ACL Mask"
        path: sections/section-020/module-01/course-03-the-acl-mask.md
      - type: reading
        title: "Wrap-Up: Mission Debrief"
        path: sections/section-020/module-01/course-04-wrap-up.md
      - type: reading
        title: "PAM Resource Limits: Making a Restriction Actually Stick"
        path: sections/section-020/module-02/course.md
      - type: reading
        title: "Why A .bashrc Limit Is Not Enough"
        path: sections/section-020/module-02/course-01-why-a-bashrc-limit-is-not-enough.md
      - type: reading
        title: "Hard Limits Through PAM"
        path: sections/section-020/module-02/course-02-hard-limits-through-pam.md
      - type: reading
        title: "One Login Per Group Member"
        path: sections/section-020/module-02/course-03-one-login-per-group-member.md
      - type: reading
        title: "Question"
        path: labs/lab-022/docs/question.md
      - type: lab
        title: "PAM Hard Limits & maxlogins Lab"
        path: labs/lab-022
        difficulty: intermediate
        estimated_duration: 20m
        topic: resource-limits
        task_kind: migration
        tags: [pam-limits, limits-d, nproc, maxlogins, hard-limit, ulimit, bashrc]
        learning_goals:
          - Find the soft process limit a user really runs with
          - Replace a .bashrc ulimit line with a hard nproc limit in limits.d
          - Allow members of a group only one login session at a time
        resources:
          - name: "limits.conf manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man5/limits.conf.5.html
          - name: "pam_limits manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man8/pam_limits.8.html
      - type: reading
        title: "Wrap-Up: Mission Debrief"
        path: sections/section-020/module-02/course-04-wrap-up.md
      - type: reading
        title: "Section 020 Knowledge Check: Access Control & Resource Limits"
        path: sections/section-020/quiz.md
      - type: reading
        title: "Question"
        path: labs/lab-020/docs/question.md
      - type: lab
        title: "Access Control & Resource Limits Capstone Lab"
        path: labs/lab-020
        difficulty: advanced
        estimated_duration: 40m
        topic: acl
        task_kind: build
        tags: [setfacl, named-entries, default-acl, recursive, limits-d, nproc, maxlogins, hard-limit]
        learning_goals:
          - Give two outside users read-write and read-only access to a shared tree, inherited by new files
          - Turn a soft .bashrc process limit into a hard PAM limit
          - Limit a group to one login session at a time
        resources:
          - name: "setfacl manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man1/setfacl.1.html
          - name: "limits.conf manual page (Ubuntu 24.04)"
