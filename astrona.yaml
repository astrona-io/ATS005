      - type: lab
        title: "Group Creation, Membership & the Active-Group Trap Lab"
        path: labs/lab-012
        difficulty: beginner
        estimated_duration: 15m
        topic: groups
        task_kind: build
        tags: [groupadd, groupmod, groupdel, gid, usermod, supplementary-groups, primary-group]
        learning_goals:
          - Create a group with a fixed GID and add existing users to it without touching their other groups
          - Rename a group while keeping its GID and its members
          - Delete a group that nothing uses
        resources:
