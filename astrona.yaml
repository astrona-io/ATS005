training:
  id: ATS005
  title: "LFCS: Users and Groups"
  description: >
    Training material covering the Linux Foundation Certified System
    Administrator (LFCS) Users and Groups domain, with hands-on labs for
    each competency.

  certification:
    name: Linux Foundation Certified System Administrator
    code: LFCS
    provider: Linux Foundation
    domain: Users and Groups
    weight: 10

modules:
  - id: module-010
    title: "Section 010: Local Account & Group Lifecycle"
    description: >
      Move beyond basic useradd/usermod busywork: relocate an existing
      account's primary group and home directory, provision new accounts
      with the right supplementary groups and a least-privilege sudoers
      rule, manage the group lifecycle directly, and handle the rest of
      an account's life — defaults, password aging, locking, and clean
      removal.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: "Module 1: User & Group Account Management"
        path: sections/section-010/module-01/course.md

      - type: reading
        title: Question
