  - id: module-040
    title: "Section 040: Centralized Identity with LDAP"
    description: >
      Build centralized identity from the ground up: install and secure
      an OpenLDAP server with TLS, populate it with real organizational
      and POSIX account data via LDIF, and wire a client into it with
      sssd — verifying NSS resolution before ever testing a login.

