  - id: module-030
    title: "Section 030: Shell Environment, Profiles & PATH"
    description: >
      Master exactly which of the many dotfiles and drop-ins actually
      gets sourced for a given session type, set variables system-wide
      and personally through the correct mechanism for each, and extend
      a user's PATH persistently without opening a privilege-escalation
      hole.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-030/README.md
      - type: reading
        title: "System-Wide & Personal Environment Profiles"
        path: sections/section-030/module-01/course.md
      - type: reading
        title: "Question"
        path: labs/lab-031/docs/question.md
      - type: lab
        title: "System-Wide and Personal Environment Variables Lab"
        path: labs/lab-031
        difficulty: beginner
        estimated_duration: 15m
        topic: environment
        task_kind: build
        tags: [environment-variables, etc-environment, bash-profile, login-shell-startup]
        learning_goals:
          - Set a variable for every user's login and non-login shells through /etc/environment
          - Set a personal variable for one user only in their login profile
        resources:
          - name: "environment manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man7/environ.7.html
          - name: "pam_env manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man8/pam_env.8.html
          - name: "Bash Reference Manual: Bash Startup Files"
            url: https://www.gnu.org/software/bash/manual/html_node/Bash-Startup-Files.html
      - type: reading
        title: "Extending PATH Safely"
        path: sections/section-030/module-02/course.md
      - type: reading
        title: "Question"
        path: labs/lab-032/docs/question.md
      - type: lab
        title: "Safe PATH Extension & Precedence Lab"
        path: labs/lab-032
        difficulty: beginner
        estimated_duration: 15m
        topic: path
        task_kind: build
        tags: [path, bash-profile, command-shadowing, login-shell-startup]
        learning_goals:
          - Add a personal directory to PATH so it survives new login shells
          - Append the directory so a same-named script never replaces a system command
        resources:
          - name: "Bash Reference Manual: Bash Startup Files"
            url: https://www.gnu.org/software/bash/manual/html_node/Bash-Startup-Files.html
          - name: "bash manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man1/bash.1.html
      - type: reading
        title: "Section 030 Knowledge Check: Shell Environment & PATH"
        path: sections/section-030/quiz.md
      - type: reading
        title: "Question"
        path: labs/lab-030/docs/question.md
      - type: lab
        title: "Shell Environment & PATH Capstone Lab"
        path: labs/lab-030
        difficulty: intermediate
        estimated_duration: 25m
        topic: environment
        task_kind: build
        tags: [environment-variables, profile-d, bash-profile, login-shell-startup, path, command-shadowing]
        learning_goals:
          - Export a variable for every login shell through a profile.d script
          - Set a personal variable and extend PATH for one user only
          - Prove that a decoy script never replaces a real system command
        resources:
          - name: "Bash Reference Manual: Bash Startup Files"
            url: https://www.gnu.org/software/bash/manual/html_node/Bash-Startup-Files.html
          - name: "bash manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man1/bash.1.html

  - id: module-040
    title: "Section 040: Centralized Identity with LDAP"
    description: >
      Build centralized identity from the ground up: install and secure
      an OpenLDAP server with TLS, populate it with real organizational
      and POSIX account data via LDIF, and wire a client into it with
      sssd — verifying NSS resolution before ever testing a login.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-040/README.md
      - type: reading
        title: "LDAP Server Installation & TLS"
        path: sections/section-040/module-01/course.md
      - type: reading
        title: "Question"
        path: labs/lab-041/docs/question.md
      - type: lab
        title: "OpenLDAP Server Install & TLS Lab"
        path: labs/lab-041
        difficulty: advanced
        estimated_duration: 35m
        topic: ldap-server
        task_kind: build
        tags: [slapd, cn-config, ldif, tls-certificates, starttls, ldaps]
        learning_goals:
          - Set the base DN, admin DN and hashed admin password through cn=config
          - Wire a certificate and key into slapd and listen on ports 389 and 636
          - Prove that StartTLS and LDAPS both work
        resources:
          - name: "OpenLDAP Administrator's Guide: Configuring slapd"
            url: https://www.openldap.org/doc/admin26/slapdconf2.html
          - name: "OpenLDAP Administrator's Guide: Using TLS"
            url: https://www.openldap.org/doc/admin26/tls.html
          - name: "slapd-config manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man5/slapd-config.5.html
      - type: reading
        title: "LDAP Directory Population & TLS Bind Verification"
        path: sections/section-040/module-02/course.md
      - type: reading
        title: "Question"
        path: labs/lab-042/docs/question.md
      - type: lab
        title: "LDAP Directory Population & Verified TLS Bind Lab"
        path: labs/lab-042
        difficulty: intermediate
        estimated_duration: 25m
        topic: ldap-directory
        task_kind: build
        tags: [ldif, ldapadd, posix-account, posix-group, ldapsearch, ldapwhoami, starttls]
        learning_goals:
          - Add organizational units, a POSIX group and a POSIX user from LDIF files
          - Set the user's password and prove an authenticated bind over required StartTLS
        resources:
          - name: "ldapadd manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man1/ldapadd.1.html
          - name: "ldapsearch manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man1/ldapsearch.1.html
          - name: "OpenLDAP Administrator's Guide: A Quick-Start Guide"
            url: https://www.openldap.org/doc/admin26/quickstart.html
      - type: reading
        title: "LDAP Client Integration with SSSD"
        path: sections/section-040/module-03/course.md
      - type: reading
        title: "Question"
        path: labs/lab-043/docs/question.md
      - type: lab
        title: "SSSD LDAP Client Integration Lab"
        path: labs/lab-043
        difficulty: intermediate
        estimated_duration: 25m
        topic: ldap-client
        task_kind: build
        tags: [sssd, nsswitch, nss, getent, starttls, local-accounts-intact]
        learning_goals:
          - Write a secure sssd.conf that reaches the directory over StartTLS
          - Add sss to nsswitch.conf and resolve directory users and groups with getent
          - Prove that local accounts still resolve as before
        resources:
          - name: "sssd.conf manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man5/sssd.conf.5.html
          - name: "sssd-ldap manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man5/sssd-ldap.5.html
          - name: "Ubuntu Server: SSSD with LDAP"
            url: https://documentation.ubuntu.com/server/how-to/sssd/with-ldap/
      - type: reading
        title: "Section 040 Knowledge Check: Centralized Identity with LDAP"
        path: sections/section-040/quiz.md
      - type: reading
        title: "Question"
        path: labs/lab-040/docs/question.md
      - type: lab
        title: "Centralized Identity with LDAP Capstone Lab"
        path: labs/lab-040
        difficulty: advanced
        estimated_duration: 60m
        topic: ldap-server
        task_kind: build
        tags: [slapd, cn-config, tls-certificates, ldif, posix-account, sssd, nsswitch, local-accounts-intact]
        learning_goals:
          - Build a TLS-secured OpenLDAP server and populate it with a POSIX group and user
          - Wire the same host into the directory with sssd and nsswitch
          - Prove that directory users resolve while local accounts stay unaffected
        resources:
          - name: "OpenLDAP Administrator's Guide"
            url: https://www.openldap.org/doc/admin26/
          - name: "sssd-ldap manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man5/sssd-ldap.5.html
          - name: "Ubuntu Server: SSSD with LDAP"
            url: https://documentation.ubuntu.com/server/how-to/sssd/with-ldap/

