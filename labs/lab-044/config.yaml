metadata:
  name: "ats-005-lab-044"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-044-setup"
      description: "Builds a populated TLS LDAP server with a wired sssd client, users lfcsuser and newcomer, no home folders and pam_mkhomedir off"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-mkhomedir-enabled"
      description: "Confirms pam_mkhomedir is active in the shared session steps and /etc/skel/WELCOME.txt exists"
      type: "file"
      source: "validation/validate-mkhomedir-enabled.sh"

    - name: "verify-first-login-home"
      description: "Logs in as a brand new directory user and checks the created home, its owner and the starter file"
      type: "file"
      source: "validation/validate-first-login.sh"

teardown:
  keepCluster: false
