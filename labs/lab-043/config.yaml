metadata:
  name: "ats-005-lab-043"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-043-setup"
      description: "Fully provisions a populated, TLS-enabled OpenLDAP server (lab-041+lab-042's end state) and installs sssd/sssd-ldap/libnss-sss/libpam-sss"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-sssd-ldap-resolution"
      description: "Confirms sssd.conf/nsswitch.conf are correctly wired, lfcsuser and developers resolve via NSS, and local accounts like root are unaffected"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
