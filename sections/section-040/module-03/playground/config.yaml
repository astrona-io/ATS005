# LDAP Client Integration with SSSD (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "sssd-client-playground"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "OS prep only: stand up a populated TLS LDAP server (Modules 1-2 end state) and install the sssd packages UNCONFIGURED. Nothing to solve."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests: []

teardown:
  keepCluster: false

runtime:
  type: "qemu"
  qemu:
    - name: ""
      image:
        type: "oci"
        source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-{ARCH}"
      cpus: 2
      memoryMB: 2048
      diskSizeGB: 15
      display: false
      sshPasswordAuth: true
