# Course manifest for ATS005 - Users and Groups (Linux Foundation Certified
# System Administrator, LFCS).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), and right after the part a lab tests, the lab's
# question.md reading and the `type: lab` entry. The module's wrap-up page
# comes last. The section quiz and the section capstone close the section.
# Playgrounds are not listed: the landing page's <!-- astrona:playground -->
# marker shows them. solution.md files are never listed.
#
# Every `type: lab` entry carries difficulty, estimated_duration, topic,
# task_kind, tags, learning_goals and resources (see CLAUDE.md for the
# allowed values). Every `path:` is relative to this file.

training:
  id: ATS005
  title: "LFCS: Users and Groups"
  description: >
    Training material covering the Linux Foundation Certified System
    Administrator (LFCS) Users and Groups domain, with hands-on labs for
    each competency.

  certification:
    name: Linux Foundation Certified System Administrator
    code: LFCS
    provider: Linux Foundation
    domain: Users and Groups
    weight: 10

modules:


  - id: module-010
    title: "Section 010: Local Account & Group Lifecycle"
    description: >
      Move beyond basic useradd/usermod busywork: relocate an existing
      account's primary group and home directory, provision new accounts
      with the right supplementary groups and a least-privilege sudoers
      rule, manage the group lifecycle directly, and handle the rest of
      an account's life — defaults, password aging, locking, and clean
      removal.

    content:
      - type: reading
        title: "Section Overview"
        path: sections/section-010/README.md
      - type: reading
        title: "User & Group Account Management"
        path: sections/section-010/module-01/course.md
      - type: reading
        title: "Primary Groups And Moving A Home"
        path: sections/section-010/module-01/course-01-primary-groups-and-moving-a-home.md
      - type: reading
        title: "Creating A New Account In One Command"
        path: sections/section-010/module-01/course-02-creating-a-new-account.md
      - type: reading
        title: "A Scoped sudo Rule"
        path: sections/section-010/module-01/course-03-a-scoped-sudo-rule.md
      - type: reading
        title: "Question"
        path: labs/lab-011/docs/question.md
      - type: lab
        title: "User & Group Provisioning and Scoped Sudo Lab"
        path: labs/lab-011
        difficulty: intermediate
        estimated_duration: 20m
        topic: local-accounts
        task_kind: build
        tags: [usermod, useradd, primary-group, supplementary-groups, home-directory, sudoers, visudo, nopasswd]
        learning_goals:
          - Move an account to a new primary group and home directory, files included
          - Create an account with the right groups, home and shell in one command
          - Grant one exact command through sudo with no password, and nothing more
        resources:
          - name: "useradd manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man8/useradd.8.html
          - name: "usermod manual page (Ubuntu 24.04)"
            url: https://manpages.ubuntu.com/manpages/noble/man8/usermod.8.html
