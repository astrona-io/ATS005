      - type: reading
        title: Solution Walkthrough
        path: labs/lab-011/docs/solution.md

      - type: lab
        title: "User & Group Provisioning and Scoped Sudo Lab"
        path: labs/lab-011

      - type: reading
        title: "Module 2: Group Lifecycle Management"
        path: sections/section-010/module-02/course.md

