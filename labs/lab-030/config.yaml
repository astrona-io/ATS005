metadata:
  name: "ats-005-lab-030"
  docs:
    solution: "docs/solution.md"
    question: "docs/question.md"

runtime:
  type: "qemu"
  qemu:
  - image:
      type: "oci"
      source: "ghcr.io/astrona-io/ubuntu-qcow2-image:24.04-lfcs-20261111-{ARCH}"
      checksums:
        amd64: sha256:1cc87d6d68d76379c457e5372d5bfecf6dea00e78231cf0057a28a83b4970b11
        arm64: sha256:bc72ff645ea1621408d18a09a638da3f077438d2dd3c5ebdd79bef8513a795e0

    cpus: 2
    memoryMB: 2048
    diskSizeGB: 15
    display: false

bootstrap:
  init:
    - name: "lab-030-setup"
      description: "Creates candidate with a ~/bin tools directory and a clean environment/profile baseline"
      type: "folder"
      source: "bootstrap/"

validation:
  scripts:
    - name: "verify-onboard-portal-login-shells"
      description: "Confirms ONBOARD_PORTAL is exported system-wide for login shells via /etc/profile.d/"
      type: "file"
      source: "validation/validate-onboard-portal.sh"

    - name: "verify-personal-editor"
      description: "Confirms EDITOR=nano is set only in candidate's own login-shell profile"
      type: "file"
      source: "validation/validate-personal-editor.sh"

    - name: "verify-path-appended-no-shadow"
      description: "Confirms ~/bin is appended (not prepended) to candidate's PATH and a decoy script there never shadows a real system command"
      type: "file"
      source: "validation/validate-path-no-shadow.sh"

teardown:
  keepCluster: false
