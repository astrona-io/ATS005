# Knowledge check for section 020. Listed in astrona.yaml as a `type: quiz` entry.
schema_version: 1
kind: question_bank
id: ats005-020
course_id: ATS005
exam_code: LFCS
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-020
  title: "Access Control & Resource Limits"
questions:

  - id: ats005-020-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Apply an ACL entry to the files already inside a directory with the recursive option"
    source_readings:
      - sections/section-020/module-01/course-01-reading-and-granting-acl-entries.md
    prompt: |-
      You run `sudo setfacl -m u:contractor-jane:rwx /srv/projects/orion` on a directory that already contains twelve existing files. Afterward, `contractor-jane` cannot open any of those existing files, though `getfacl` on the directory itself shows her entry correctly. What went wrong?
    options:
      - id: a
        text: "`setfacl` requires `-b` before `-m` to initialize the ACL correctly."
        explanation: "This option is incorrect because `-b` removes all ACL entries; it is not a prerequisite for `-m` and would work against the goal here."
      - id: b
        text: "The `-m` flag was never applied without `-R`, so only the directory entry itself was changed — the existing files inside keep their original permissions untouched."
        explanation: "Correct. `setfacl -m` without `-R` only modifies the ACL of the exact path given on the command line. Files and subdirectories that already exist inside that directory are completely unaffected — they keep whatever permissions they had before. `-R` is required to recursively apply the same ACL entry to every existing file and subdirectory in the tree."
      - id: c
        text: "Named-user ACL entries only ever apply to directories, never to regular files."
        explanation: "This option is incorrect because named-user entries apply to regular files exactly as well as directories."
      - id: d
        text: "The mask entry silently blocked the new permission from taking effect on existing files."
        explanation: "This option is incorrect because the mask caps *effective* permission of entries that exist — it doesn't explain files having no entry applied to them at all."
    correct_option: b
    explanation: "`setfacl -m` without `-R` only modifies the ACL of the exact path given on the command line. Files and subdirectories that already exist inside that directory are completely unaffected — they keep whatever permissions they had before. `-R` is required to recursively apply the same ACL entry to every existing file and subdirectory in the tree."

  - id: ats005-020-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict how the ACL mask limits a named entry"
    source_readings:
      - sections/section-020/module-01/course-03-the-acl-mask.md
    prompt: |-
      After granting `auditor-tom` a named ACL entry of `r-x` on `/srv/projects/orion`, you set the directory's mask with `sudo setfacl -m m::r-- /srv/projects/orion`. What is auditor-tom's actual effective access now?
    options:
      - id: a
        text: "Still `r-x`, because the mask only affects the traditional group-owner entry, never named entries."
        explanation: "This option is incorrect because the mask specifically targets named entries (and the owning group); only the file-owner entry and \"other\" entry are exempt from it."
      - id: b
        text: "`r--` — the mask caps every named user/group entry's effective permission, so the `x` bit is now blocked regardless of what the named entry itself grants."
        explanation: "Correct. The mask entry caps the effective permission of every named user entry, named group entry, and the owning-group entry. A named entry of `r-x` against a mask of `r--` means the effective permission is the intersection of the two — `r--` only. The named entry itself is unchanged in `getfacl` output, but its *effective* grant is reduced."
      - id: c
        text: "`rwx`, because named entries always override a more restrictive mask."
        explanation: "Named entries never override a more restrictive mask; the mask is a hard cap, not a suggestion."
      - id: d
        text: "No access at all, because setting the mask manually revokes every named entry on the file."
        explanation: "This option is incorrect because setting the mask does not delete or disable any entries; it only limits their effective permission."
    correct_option: b
    explanation: "The mask entry caps the effective permission of every named user entry, named group entry, and the owning-group entry. A named entry of `r-x` against a mask of `r--` means the effective permission is the intersection of the two — `r--` only. The named entry itself is unchanged in `getfacl` output, but its *effective* grant is reduced."

  - id: ats005-020-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Add a default ACL so new files inherit a grant"
    source_readings:
      - sections/section-020/module-01/course-02-default-acls.md
    prompt: |-
      A shared directory needs contractor access today, and needs every file created in it a month from now to automatically carry the same access, with no manual `setfacl` re-run required for new files. Which single addition accomplishes the second half of that requirement?
    options:
      - id: a
        text: "Running `setfacl -R -m u:contractor-jane:rwx` again periodically via a cron job."
        explanation: "This option is a fragile workaround that only catches new files periodically and requires ongoing maintenance, not automatic inheritance."
      - id: b
        text: "Setting a default ACL entry with `setfacl -d -m u:contractor-jane:rwx` on the parent directory."
        explanation: "Correct. A default ACL entry (`-d`) is a template the kernel consults at file-creation time. Any new file or subdirectory created under a directory carrying a default ACL automatically receives that entry as its own access ACL, with zero manual intervention needed at creation time."
      - id: c
        text: "Adding `contractor-jane` to the directory's owning group."
        explanation: "This option violates the explicit requirement of not changing group membership, and grants broader access than intended."
      - id: d
        text: "Changing the directory's mode to `777` so any new file inherits full access automatically."
        explanation: "This option is a serious security regression — it grants full read-write-execute to literally everyone, not scoped access to one contractor."
    correct_option: b
    explanation: "A default ACL entry (`-d`) is a template the kernel consults at file-creation time. Any new file or subdirectory created under a directory carrying a default ACL automatically receives that entry as its own access ACL, with zero manual intervention needed at creation time."

  - id: ats005-020-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why a .bashrc limit does not bind a cron job"
    source_readings:
      - sections/section-020/module-02/course-01-why-a-bashrc-limit-is-not-enough.md
    prompt: |-
      User `mallory` has a line in her `.bashrc` reading `ulimit -Sp 100`, intended to cap her process count. A cron job running as `mallory` still manages to fork far past 100 processes and destabilizes the server. Why did the `.bashrc` restriction fail to apply?
    options:
      - id: a
        text: "`ulimit -Sp` only limits open file descriptors, not process count."
        explanation: "This option is incorrect because `-p` (or `-u` on some shells) specifically targets `nproc`, the max process count, not file descriptors."
      - id: b
        text: "`.bashrc` is only sourced for interactive, non-login shells; cron jobs don't source it at all, so the limit never applies to that code path."
        explanation: "Correct. `.bashrc` is sourced specifically for interactive, non-login shells. Cron jobs, non-interactive SSH commands, and many systemd-launched sessions never source `.bashrc` at all, so any `ulimit` command placed there simply never executes for those paths — leaving exactly the automated, script-driven processes most likely to misbehave completely unrestricted."
      - id: c
        text: "The limit was set as a hard limit, and hard limits don't apply to background jobs."
        explanation: "The line as written set a *soft* limit (`-S`), and regardless, the actual failure is that `.bashrc` was never sourced by the cron path at all."
      - id: d
        text: "`ulimit` values only take effect after a full system reboot."
        explanation: "`ulimit` is a per-session shell setting; it has nothing to do with reboot cycles."
    correct_option: b
    explanation: "`.bashrc` is sourced specifically for interactive, non-login shells. Cron jobs, non-interactive SSH commands, and many systemd-launched sessions never source `.bashrc` at all, so any `ulimit` command placed there simply never executes for those paths — leaving exactly the automated, script-driven processes most likely to misbehave completely unrestricted."

  - id: ats005-020-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Write a hard limit in limits.d and read it back after a fresh login"
    source_readings:
      - sections/section-020/module-02/course-02-hard-limits-through-pam.md
    prompt: |-
      You write a perfectly-formed entry, `jackie hard nproc 150`, into `/etc/security/limits.d/jackie-nproc.conf`. After a fresh SSH login, `ulimit -Hp` for jackie still reports `unlimited`. What is the most likely cause, and where should you check first?
    options:
      - id: a
        text: "The file must be named exactly `limits.conf`; drop-in files under `limits.d` are never read."
        explanation: "`/etc/security/limits.d/*.conf` drop-ins are read identically to entries in the main `limits.conf` file; this is the recommended pattern, not a broken one."
      - id: b
        text: "`pam_limits.so` is missing (or commented out) from the `session` stack of the PAM service governing this login path — check `/etc/pam.d/sshd` and any included `common-session`/`system-auth` file."
        explanation: "Correct. `limits.conf`/`limits.d` entries are only ever applied by `pam_limits.so`, and only for PAM service stacks that actually include that module in their `session` block. If it's absent or commented out for the login path being used (commonly `sshd`, `login`, or a shared `common-session`/`system-auth` file), every limits entry on the system is parsed by nothing and has zero effect — this is the single most common reason a correctly-written limits file appears to silently do nothing."
      - id: c
        text: "`nproc` limits only apply to root-owned processes."
        explanation: "`nproc` limits apply to the named non-root user exactly as configured."
      - id: d
        text: "The value must be set as `soft`, not `hard`, for SSH sessions specifically."
        explanation: "`hard` is the correct type for an unraisable ceiling; switching to `soft` would make it user-adjustable, the opposite of what's needed."
    correct_option: b
    explanation: "`limits.conf`/`limits.d` entries are only ever applied by `pam_limits.so`, and only for PAM service stacks that actually include that module in their `session` block. If it's absent or commented out for the login path being used (commonly `sshd`, `login`, or a shared `common-session`/`system-auth` file), every limits entry on the system is parsed by nothing and has zero effect — this is the single most common reason a correctly-written limits file appears to silently do nothing."

  - id: ats005-020-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why limits.conf does not reach services and which setting does"
    source_readings:
      - sections/section-020/module-03/course-01-limits-for-a-service.md
    prompt: |-
      A service `ledger-sync` keeps running out of open files. You add a `nofile` line to a file in `/etc/security/limits.d/`, restart the service, and the limit does not change. Why, and what works?
    options:
      - id: a
        text: "The `limits.d` files apply only to logins through PAM, so use `LimitNOFILE=` in a drop-in for the service."
        explanation: "Correct. Services are started by `systemd`, not by a login, so `pam_limits` never runs for them."
      - id: b
        text: "The file name must end in `.limits`, and then the restart is enough."
        explanation: "No. The ending is not the problem. Services do not use these files."
      - id: c
        text: "A service can never have its open-file limit changed."
        explanation: "No. `systemd` sets it from `LimitNOFILE=`."
      - id: d
        text: "Only a reboot makes `limits.d` files reach services."
        explanation: "No. A reboot does not change which files `systemd` reads."
    correct_option: a
    explanation: "Services are started by `systemd`, not by a login, so `pam_limits` never runs for them."

  - id: ats005-020-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Apply and prove a systemd limit change"
    source_readings:
      - sections/section-020/module-03/course-01-limits-for-a-service.md
    prompt: |-
      You added `LimitNOFILE=4096` to `/etc/systemd/system/ledger-sync.service.d/limits.conf`. Which steps make the running process carry it, and where do you prove it?
    options:
      - id: a
        text: "Run `systemctl daemon-reload`, restart the service, and read `/proc/<pid>/limits`."
        explanation: "Correct. `daemon-reload` makes `systemd` read the drop-in, the restart starts a new process with the limit, and `/proc/<pid>/limits` is the kernel's own record."
      - id: b
        text: "Nothing. A running process picks up the new limit by itself."
        explanation: "No. A running process keeps the limit it started with."
      - id: c
        text: "Only restart the service. `daemon-reload` is not needed after a drop-in change."
        explanation: "No. Without `daemon-reload`, `systemd` can still use the old settings."
      - id: d
        text: "Log out and in again, then run `ulimit -n` in your shell."
        explanation: "No. Your shell is not the service. Read the limits of the service's own process."
    correct_option: a
    explanation: "`daemon-reload` makes `systemd` read the drop-in, the restart starts a new process with the limit, and `/proc/<pid>/limits` is the kernel's own record."

  - id: ats005-020-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Cap the tasks of one user with a slice limit"
    source_readings:
      - sections/section-020/module-03/course-02-limits-for-a-user-slice.md
    prompt: |-
      User `dana` has UID `2010`. You want at most `100` tasks across all of her sessions, and the setting must survive `systemctl daemon-reload`. Which is correct?
    options:
      - id: a
        text: "Put `TasksMax=100` in a drop-in for `user-2010.slice`."
        explanation: "Correct. Every session of UID 2010 runs inside that slice, so one cap covers all of them, and a drop-in file is saved on disk."
      - id: b
        text: "Put `nproc 100` in `/etc/profile.d/dana.sh`."
        explanation: "No. A `profile.d` script is not a limit, and `nproc` is not a shell variable."
      - id: c
        text: "Run `ulimit -u 100` once in her shell."
        explanation: "No. This affects one shell only and is lost when it ends."
      - id: d
        text: "Put `TasksMax=100` in `ledger-sync.service`."
        explanation: "No. That caps one service, not the user's sessions."
    correct_option: a
    explanation: "Every session of UID 2010 runs inside that slice, so one cap covers all of them, and a drop-in file is saved on disk."

  - id: ats005-020-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use capital X to give pass-through only where it belongs"
    source_readings:
      - sections/section-020/module-04/course-01-acls-on-a-whole-tree.md
    prompt: |-
      A tree holds folders, data files and one script. You run `setfacl -R -m u:auditor-ivy:rX /srv/data/ledger`. What does `auditor-ivy` get on a plain data file?
    options:
      - id: a
        text: "`r-x`, because every file in a tree is made executable."
        explanation: "No. This is what a plain `rx` would do. The capital `X` avoids it."
      - id: b
        text: "`r--`. Folders and the script get `r-x`."
        explanation: "Correct. The capital `X` gives execute only to folders and to files that are already executable."
      - id: c
        text: "Nothing, because `-R` skips files."
        explanation: "No. `-R` walks the folders and the files."
      - id: d
        text: "`rw-`, because `X` stands for write."
        explanation: "No. `X` is a conditional execute bit."
    correct_option: b
    explanation: "The capital `X` gives execute only to folders and to files that are already executable."

  - id: ats005-020-q10
    type: single_choice
    difficulty: intermediate
    learning_objective: "Save and restore the ACLs of a tree"
    source_readings:
      - sections/section-020/module-04/course-02-backup-and-restore.md
    prompt: |-
      You will run a cleanup that removes all ACLs from `/srv/data/ledger`. Which pair of commands saves them first and puts them back later?
    options:
      - id: a
        text: "`getfacl -R -p /srv/data/ledger > backup` and `setfacl --restore=backup`"
        explanation: "Correct. `-R` walks the tree, `-p` keeps absolute paths, and `--restore` reads the file back as `root`."
      - id: b
        text: "`cp -r /srv/data/ledger /root/copy` and `cp -r /root/copy /srv/data/ledger`"
        explanation: "No. A plain copy does not keep extended entries."
      - id: c
        text: "`setfacl -R -m backup /srv/data/ledger` and `setfacl -R -x backup /srv/data/ledger`"
        explanation: "No. `-m` and `-x` change entries. Neither saves or restores a copy."
      - id: d
        text: "`getfacl /srv/data/ledger > backup` and `setfacl --restore=backup`"
        explanation: "No. Without `-R`, only the top folder is saved."
    correct_option: a
    explanation: "`-R` walks the tree, `-p` keeps absolute paths, and `--restore` reads the file back as `root`."

  - id: ats005-020-q11
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose between removing one name and removing all entries"
    source_readings:
      - sections/section-020/module-04/course-01-acls-on-a-whole-tree.md
    prompt: |-
      The vendor `temp-vendor` leaves, and every other entry in `/srv/data/ledger` must stay. Which command is correct?
    options:
      - id: a
        text: "`setfacl -R -b /srv/data/ledger`"
        explanation: "No. `-b` removes every extended entry for everyone."
      - id: b
        text: "`setfacl -R -x u:temp-vendor:r-x /srv/data/ledger`"
        explanation: "No. `-x` takes the user only. Permission letters make it an error."
      - id: c
        text: "`setfacl -R -x u:temp-vendor /srv/data/ledger`"
        explanation: "Correct. `-x` removes the named entry on every path and leaves the others."
      - id: d
        text: "`setfacl -R -m u:temp-vendor:--- /srv/data/ledger`"
        explanation: "No. This keeps an entry with no permissions. The name is still in every list."
    correct_option: c
    explanation: "`-x` removes the named entry on every path and leaves the others."
